<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>学習クエスト RPG</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
        :root {
            --bg-color: #050505;
            --win-bg: #111;
            --text-color: #e0e0e0;
            --accent-color: #4db8ff;
            --danger-color: #ff4444;
            --sage-color: #ffd700;
            --base-font-size: 16px;
            --btn-padding: 12px;
            --window-width: 750px;
            --char-size: 220px;
        }

        @media (max-width: 600px) {
            :root {
                --base-font-size: 14px;
                --btn-padding: 16px;
                --window-width: 100%;
                --char-size: 130px;
            }
            .game-window { height: 100dvh; border-radius: 0 !important; border:none !important;}
            .stage-grid { grid-template-columns: 1fr 1fr !important; }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'DotGothic16', sans-serif; font-size: var(--base-font-size);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            height: 100vh; height: 100dvh;
            margin: 0; overflow: hidden; touch-action: none;
        }

        /* ゲーム画面 */
        #game-wrapper {
            position: relative;
            width: 100%; max-width: 480px;
            height: calc(100dvh - 200px); max-height: 480px;
            border: 2px solid #fff; background-color: #000; flex-shrink: 0;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* コントローラー */
        #controller {
            width: 100%; max-width: 480px; height: 160px;
            display: grid; grid-template-columns: 1fr 1fr; padding: 10px;
            box-sizing: border-box; background: #222; border-top: 2px solid #555;
            position: relative; flex-shrink: 0;
        }
        #bgm-toggle {
            position: absolute; top: 5px; right: 10px;
            padding: 5px 10px; font-size: 0.8rem;
            background: #333; border: 1px solid #666; color: #fff;
            border-radius: 4px; cursor: pointer; font-family: inherit;
        }
        #bgm-toggle:active { background: #555; }
        #bgm-toggle.off { color: #f44; border-color: #f44; }
        .d-pad {
            display: grid; grid-template-areas: ". up ." "left . right" ". down .";
            gap: 4px; width: 130px; height: 130px; justify-self: center; align-self: center;
        }
        .d-btn {
            width: 42px; height: 42px; background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; user-select: none; cursor: pointer;
        }
        .d-btn:active { background: rgba(255, 255, 255, 0.5); }
        .action-pad { display: flex; justify-content: center; align-items: center; }
        .a-btn {
            width: 70px; height: 70px; background: rgba(255, 100, 100, 0.3);
            border: 4px solid rgba(255, 100, 100, 0.8); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; font-weight: bold; user-select: none; cursor: pointer;
        }
        .a-btn:active { background: rgba(255, 100, 100, 0.6); }

        /* UIオーバーレイ */
        .overlay {
            position: absolute; bottom: 10px; left: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.9); border: 2px solid #fff; border-radius: 8px;
            padding: 15px; display: none; font-size: 1rem; line-height: 1.5; z-index: 10;
        }
        #battle-ui { top: 10px; bottom: 10px; display: none; flex-direction: column; justify-content: space-between; }
        .hp-bar-frame { width: 100%; height: 10px; background: #333; border: 1px solid #fff; margin-bottom: 5px; }
        .hp-bar-fill { height: 100%; width: 100%; transition: width 0.2s; }
        .hp-green { background: #0f0; } .hp-red { background: #f00; }
        .enemy-display { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .enemy-img-large { 
            width: clamp(100px, 30vmin, 200px); height: clamp(100px, 30vmin, 200px); 
            object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 0 10px red);
        }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn { background: #222; color: white; border: 2px solid #fff; padding: 10px; font-family: inherit; cursor: pointer; text-align: left; }
        .btn.correct { background: #050; border-color: #0f0; } 
        .btn.wrong { background: #500; border-color: #f00; }

        /* スタート画面 */
        #start-screen {
            position: absolute; inset: 0; background: #000; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        /* モード選択ボタン */
        .mode-select-btn {
            padding: 20px 40px; font-size: 1.2rem; border: 2px solid #4db8ff;
            background: #222; color: #fff; cursor: pointer; border-radius: 8px;
            font-family: inherit; text-align: center; line-height: 1.4;
        }
        .mode-select-btn:hover { background: #333; }
        .mode-select-btn:active { transform: scale(0.98); }

        /* ダンジョンモード用スタイル */
        #dungeon-wrapper {
            position: absolute; inset: 0; background: #111; z-index: 50;
            display: none; flex-direction: column; overflow: hidden;
        }
        .dungeon-header {
            background: #222; padding: 8px 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #555; flex-shrink: 0;
        }
        .dungeon-menu { flex: 1; overflow-y: auto; padding: 15px; }
        .special-modes {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #333;
        }
        .dg-mode-btn {
            padding: 15px; border: 2px solid #555; border-radius: 8px;
            background: #222; color: #fff; cursor: pointer;
            font-family: inherit; font-weight: bold; text-align: center;
        }
        .dg-mode-btn.review { border-color: #4db8ff; color: #4db8ff; }
        .dg-mode-btn.sudden { border-color: #ff4444; color: #ff4444; }
        .stage-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .stage-card {
            background: #222; border: 2px solid #555; border-radius: 8px;
            padding: 10px; text-align: center; cursor: pointer;
            min-height: 70px; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .stage-card.cleared { border-color: #4f4; color: #cfc; }
        .stage-card .stage-num { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
        .stage-card .stage-title { font-size: 0.85rem; font-weight: bold; }
        
        /* ダンジョンオーバーレイ */
        .dg-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 60; display: none; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
        }
        .dg-card {
            width: 90%; max-width: 350px; background: #222; border: 2px solid #fff;
            border-radius: 10px; padding: 20px; text-align: center;
        }
        .dg-btn {
            width: 100%; padding: 12px; margin-top: 10px; border: 2px solid #fff;
            background: #333; color: #fff; font-family: inherit; cursor: pointer;
            border-radius: 6px; font-size: 1rem;
        }
        .dg-btn:active { background: #555; }
        .dg-btn.study { border-color: #ffd700; color: #ffd700; }
        .dg-btn.battle { border-color: #ff4444; color: #ff4444; }
        
        /* 勉強画面 */
        .study-screen {
            position: absolute; inset: 0; background: #000; z-index: 70;
            display: none; flex-direction: column;
        }
        .sage-area {
            flex: 1; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle, #333, #000); flex-direction: column;
        }
        .dialogue-container { background: #000; border-top: 4px solid #fff; padding: 15px; }
        .dialogue-name { color: #ffd700; font-weight: bold; margin-bottom: 8px; }
        .dialogue-text { min-height: 80px; font-size: 1rem; line-height: 1.5; cursor: pointer; }
        .study-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
        .study-controls button { padding: 10px; font-size: 0.9rem; }
        
        /* ダンジョンバトル画面 */
        .dg-battle {
            position: absolute; inset: 0; background: #000; z-index: 70;
            display: none; flex-direction: column;
        }
        .dg-battle-scene {
            flex: 0 0 45%; background: radial-gradient(circle at bottom, #223, #000);
            display: flex; flex-direction: column; padding: 10px;
        }
        .dg-enemy-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .dg-enemy-img { 
            width: clamp(120px, 35vmin, 280px); height: clamp(120px, 35vmin, 280px); 
            object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 0 15px rgba(255,50,50,0.5));
        }
        .dg-enemy-emoji { font-size: clamp(80px, 25vmin, 150px) !important; }
        .dg-hp-container { width: 180px; background: #000; border: 2px solid #666; border-radius: 4px; padding: 2px; margin-top: 10px; }
        .dg-hp-bar { height: 8px; transition: width 0.3s; }
        .dg-hp-red { background: linear-gradient(to right, #f00, #900); }
        .dg-hp-green { background: linear-gradient(to right, #0f0, #090); }
        .dg-command { flex: 1; background: #1a1a1a; border-top: 2px solid #444; padding: 15px; display: flex; flex-direction: column; }
        .dg-msg { border: 2px solid #555; border-radius: 6px; padding: 10px; margin-bottom: 10px; min-height: 60px; background: #000; line-height: 1.4; }
        .dg-quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
        .dg-quiz-btn {
            background: #2a2a2a; color: #eee; border: 2px solid #555;
            padding: 12px; font-family: inherit; font-size: 0.9rem; cursor: pointer; text-align: left; border-radius: 6px;
        }
        .dg-quiz-btn.correct { background: #151 !important; border-color: #4f4 !important; }
        .dg-quiz-btn.wrong { background: #511 !important; border-color: #f44 !important; }
        .dg-next-btn { margin-top: 10px; background: #4db8ff; color: #000; font-weight: bold; border: none; display: none; }
        
        .dg-result {
            position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 80; display: none; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }

        @keyframes dg-damage { 0% { transform: translate(0,0); } 25% { transform: translate(-5px,3px); } 50% { transform: translate(5px,-3px); } 100% { transform: translate(0,0); } }
        .dg-anim-damage { animation: dg-damage 0.3s; }

    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="rpg-status" style="position:absolute; top:5px; left:5px; right:5px; background:rgba(0,0,0,0.7); padding:5px 10px; border-radius:4px; font-size:0.8rem; z-index:5; display:none; justify-content:space-between; align-items:center;">
        <div>
            <span style="color:#0f0;">❤️ HP: </span><span id="status-hp">100</span>
            <span style="color:#888; margin-left:10px;">📍 </span><span id="status-location">村</span>
        </div>
        <button onclick="backToTitle()" style="padding:3px 8px; font-size:0.7rem; background:#333; border:1px solid #666; color:#fff; border-radius:3px; cursor:pointer;">タイトルへ</button>
    </div>
    <canvas id="gameCanvas" width="480" height="480"></canvas>

    <div id="start-screen">
        <h1 id="game-main-title" style="color:#4db8ff; margin-bottom:10px;">学習クエスト [未装填]</h1>
        <p id="game-sub-title" style="color:#aaa; font-size:0.75rem; margin-bottom:15px;">知識の力で魔王を倒せ！</p>
        
        <div style="margin-bottom: 20px; text-align: center; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; border: 1px dashed #4db8ff;">
            <p style="color: #fff; margin-bottom: 10px; font-size: 0.9rem;">📂 問題データ(CSV)をセットして開始</p>
            <input type="file" id="csv-file" accept=".csv" style="color: #fff; font-size: 0.8rem; width: 100%; max-width: 250px;" />
        </div>

        <div style="display:flex; flex-direction:column; gap:12px;">
            <button class="mode-select-btn" onclick="startRPGMode()">🗡️ RPGモード<br><span style="font-size:0.7rem; color:#aaa;">村の賢者から学び、フィールドで魔王討伐！</span></button>
            <button class="mode-select-btn" onclick="startDungeonMode()">🏰 ダンジョンモード<br><span style="font-size:0.7rem; color:#aaa;">ステージを選んで学習＆テスト</span></button>
        </div>
        <p style="color:#666; margin-top:12px; font-size:0.7rem;">🔊 音が出ます（右下でON/OFF可）</p>
    </div>

    <div id="dialogue-box" class="overlay">
        <div id="dialogue-text">...</div>
        <div style="text-align: right; font-size: 0.8rem; color: #aaa; margin-top:5px;">▼ 進む(Aボタン)</div>
    </div>

    <div id="battle-ui" class="overlay">
        <div>
            <div id="enemy-name">スライム</div>
            <div class="hp-bar-frame"><div id="enemy-hp" class="hp-bar-fill hp-red"></div></div>
        </div>
        <div class="enemy-display">
            <img id="battle-enemy-img" src="" alt="ENEMY" class="enemy-img-large">
            <div id="battle-msg" style="margin-top: 10px; min-height: 1.5em; text-align: center;">現れた！</div>
        </div>
        <div>
            <div style="display: flex; justify-content: space-between;"><span>勇者</span><span id="player-hp-text">HP: 100</span></div>
            <div class="hp-bar-frame"><div id="player-hp" class="hp-bar-fill hp-green"></div></div>
            <div id="quiz-area" style="display:none; margin-top: 10px;">
                <div id="quiz-text" style="margin-bottom:5px; font-size:0.95rem;">問題</div>
                <div id="quiz-options" class="quiz-options"></div>
            </div>
            <button id="battle-next-btn" class="btn" style="width:100%; display:none; text-align:center;" onclick="Battle.next()">次へ</button>
        </div>
    </div>
</div>

<div id="dungeon-wrapper" style="display:none;">
    <div class="dungeon-header">
        <span id="dg-header-title">アカデミアの村</span>
        <button class="dg-btn" style="padding:4px 12px; font-size:0.85rem; width:auto;" onclick="backToTitle()">タイトルへ</button>
    </div>
    
    <div class="dungeon-menu" id="dg-menu">
        <div class="special-modes">
            <button class="dg-mode-btn review" onclick="DG.startReview()">📝 復習帳<br><span style="font-size:0.8rem" id="dg-review-count">0問</span></button>
            <button class="dg-mode-btn sudden" onclick="DG.startSudden()">💀 サドンデス<br><span style="font-size:0.8rem">1ミスで終了</span></button>
        </div>
        <h3 style="text-align:center; margin-bottom:10px; color:#fff;">学習ステージ</h3>
        <div class="stage-grid" id="dg-stage-grid"></div>
    </div>
    
    <div class="dg-overlay" id="dg-action-select">
        <div class="dg-card">
            <h2 id="dg-act-title" style="color:#fff; margin-bottom:15px;">ステージ名</h2>
            <button class="dg-btn study" onclick="DG.startLecture()">📖 賢者の講義（勉強）</button>
            <button class="dg-btn battle" onclick="DG.openDiffSelect()">⚔️ 試練の塔（テスト）</button>
            <button class="dg-btn" style="margin-top:20px; border-color:#555;" onclick="DG.closeAction()">やめる</button>
        </div>
    </div>
    
    <div class="dg-overlay" id="dg-diff-select">
        <div class="dg-card">
            <h2 style="color:#fff; margin-bottom:15px;">難易度を選択</h2>
            <button class="dg-btn" onclick="DG.selectDiff(1)">Lv.1 入門（3問）</button>
            <button class="dg-btn" onclick="DG.selectDiff(2)">Lv.2 初級（5問）</button>
            <button class="dg-btn" onclick="DG.selectDiff(3)">Lv.3 中級（7問）</button>
            <button class="dg-btn" onclick="DG.selectDiff(4)">Lv.4 上級（10問）</button>
            <button class="dg-btn" onclick="DG.selectDiff(5)">Lv.5 鬼（15問）</button>
            <button class="dg-btn" style="margin-top:20px; border-color:#555;" onclick="DG.closeDiff()">戻る</button>
        </div>
    </div>
    
    <div class="study-screen" id="dg-study">
        <div class="sage-area">
            <img id="dg-sage-img" src="sage.png" alt="賢者" style="max-width:80%; max-height:50%; object-fit:contain; filter:drop-shadow(0 0 20px gold);" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div style="font-size:100px; filter:drop-shadow(0 0 15px gold); display:none;">🧙‍♂️</div>
        </div>
        <div class="dialogue-container">
            <div class="dialogue-name">賢者</div>
            <div class="dialogue-text" id="dg-dialogue-text" onclick="DG.nextLecture()">...</div>
            <div class="study-controls">
                <button class="dg-btn" id="dg-lec-prev" onclick="DG.prevLecture()">◀ 前へ</button>
                <button class="dg-btn" style="border-color:#aaa;" onclick="DG.showMenu()">中断</button>
                <button class="dg-btn" id="dg-lec-next" onclick="DG.nextLecture()">次へ ▶</button>
            </div>
        </div>
    </div>
    
    <div class="dg-battle" id="dg-battle">
        <div class="dg-battle-scene" id="dg-scene">
            <div style="position:absolute; top:10px; left:10px;">
                <button class="dg-btn" style="padding:4px 10px; font-size:0.75rem; width:auto;" onclick="DG.confirmExit()">← 戻る</button>
            </div>
            <div style="position:absolute; top:10px; right:10px; font-size:0.75rem; background:#fff; color:#000; padding:2px 8px; border-radius:4px;" id="dg-badge">NORMAL</div>
            <div class="dg-enemy-area">
                <img id="dg-enemy-img" class="dg-enemy-img" src="" alt="" style="display:none;">
                <div class="dg-enemy-emoji" id="dg-enemy-emoji">👾</div>
                <div id="dg-enemy-name" style="color:#ff8888; margin-top:10px;">Enemy</div>
                <div class="dg-hp-container"><div class="dg-hp-bar dg-hp-red" id="dg-enemy-hp" style="width:100%;"></div></div>
            </div>
            <div style="background:rgba(0,0,0,0.6); padding:8px; border:1px solid #444; border-radius:8px; margin-top:auto;">
                <div style="display:flex; justify-content:space-between; font-size:0.9rem;"><span>You</span><span id="dg-player-hp-text">100</span></div>
                <div class="dg-hp-container" style="width:100%; margin-top:4px;"><div class="dg-hp-bar dg-hp-green" id="dg-player-hp" style="width:100%;"></div></div>
            </div>
        </div>
        <div class="dg-command">
            <div class="dg-msg" id="dg-msg">バトル開始！</div>
            <button class="dg-btn dg-next-btn" id="dg-next-btn" onclick="DG.handleNext()">▼ 次へ進む</button>
            <div class="dg-quiz-grid" id="dg-quiz"></div>
        </div>
    </div>
    
    <div class="dg-result" id="dg-result">
        <h1 id="dg-result-title" style="font-size:2.5rem; margin-bottom:20px;">RESULT</h1>
        <p id="dg-result-msg" style="margin-bottom:30px;">...</p>
        <div style="display:flex; flex-direction:column; gap:10px; align-items:center;">
            <button class="dg-btn" style="width:200px;" onclick="DG.showMenu()">村へ帰還</button>
            <button class="dg-btn" style="width:200px; border-color:#666; color:#aaa;" onclick="backToTitle()">タイトルへ</button>
        </div>
    </div>
</div>

<div id="controller">
    <button id="bgm-toggle" onclick="toggleBGM()">🔊 BGM ON</button>
    <div class="d-pad">
        <div class="d-btn" id="btn-up" style="grid-area: up;">↑</div>
        <div class="d-btn" id="btn-left" style="grid-area: left;">←</div>
        <div class="d-btn" id="btn-right" style="grid-area: right;">→</div>
        <div class="d-btn" id="btn-down" style="grid-area: down;">↓</div>
    </div>
    <div class="action-pad">
        <div class="a-btn" id="btn-action">A</div>
    </div>
</div>

<script>
// ===========================================
// 動的データ読み込み (マガジン機能)
// ===========================================
let DB = [];
let STAGES = [];
let LECTURES = {};

document.getElementById('csv-file').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    // ファイル名から「.csv」を消してゲームタイトルにする
    const titleName = file.name.replace('.csv', '');
    document.getElementById('game-main-title').innerText = titleName;
    document.getElementById('game-sub-title').innerText = "セットされた問題で魔王を倒せ！";

    const reader = new FileReader();
    reader.onload = function(event) {
        parseCSV(event.target.result);
        alert(`「${titleName}」の問題データを装填しました！\n全 ${DB.length} 問、${STAGES.length} ステージ`);
    };
    // 日本語の文字化けを防ぐため Shift_JIS で読み込む
    reader.readAsText(file, 'Shift_JIS');
});

// CSV文字列をゲームデータに変換する関数
function parseCSV(text) {
    DB = [];
    STAGES = [];
    LECTURES = {};
    const stageMap = new Map();

    const lines = text.split(/\r\n|\n/);
    
    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        
        // 簡易的なCSVパース (ダブルクォーテーション内のカンマも考慮)
        let cols = [];
        let inQuotes = false;
        let currentStr = "";
        for(let char of lines[i]) {
            if(char === '"') {
                inQuotes = !inQuotes;
            } else if(char === ',' && !inQuotes) {
                cols.push(currentStr);
                currentStr = "";
            } else {
                currentStr += char;
            }
        }
        cols.push(currentStr);
        
        if (cols.length < 8) continue;

        const sid = parseInt(cols[0].trim(), 10);
        const stageName = cols[1].trim();
        const qText = cols[2].trim();
        const correct = cols[3].trim();
        const w1 = cols[4].trim();

        const w3 = cols[6].trim();
        const exp = cols[7].trim();
        const lecture = cols[8] ? cols[8].trim() : `${stageName}についてしっかり学ぶのじゃ！`;

        DB.push({
            sid: sid,
            q: qText,
            a: [correct, w1, w2, w3].filter(x => x !== ""), 
            exp: exp
        });

        if (!stageMap.has(sid)) {
            stageMap.set(sid, { id: sid, name: stageName, img: `stage${sid}.png` });
        }

        if (!LECTURES[sid]) LECTURES[sid] = [];
        if (!LECTURES[sid].includes(lecture)) LECTURES[sid].push(lecture);
    }
    
    STAGES = Array.from(stageMap.values());
}

const Sound = {
    ctx: null, osc: null, intervalId: null, isPlaying: false,
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    playBGM(type) {
        if (!bgmEnabled) return;
        if (!this.ctx) this.init(); if (this.ctx.state === 'suspended') this.ctx.resume();
        this.stopBGM();
        let melody = [], tempo = 150;
        if (type === 'village') { melody = [261, 329, 392, 329, 261, 329, 392, 329, 440, 349, 261, 349, 440, 349, 293, 247]; tempo = 300; }
        else if (type === 'field') { melody = [392, 392, 440, 523, 587, 523, 440, 392, 392, 330, 392, 523]; tempo = 200; }
        else if (type === 'battle') { melody = [110, 110, 130, 110, 146, 110, 130, 110, 164, 110, 146, 110]; tempo = 100; }
        else if (type === 'boss') { melody = [65, 73, 82, 73, 65, 73, 82, 97]; tempo = 120; }
        let noteIndex = 0;
        const playNote = () => {
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.type = (type === 'boss' || type === 'battle') ? 'sawtooth' : 'triangle';
            osc.frequency.value = melody[noteIndex];
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + (tempo/1000)*0.9);
            osc.start(); osc.stop(this.ctx.currentTime + (tempo/1000));
            noteIndex = (noteIndex + 1) % melody.length;
        };
        playNote(); this.intervalId = setInterval(playNote, tempo); this.isPlaying = true;
    },
    stopBGM() { if (this.intervalId) clearInterval(this.intervalId); this.isPlaying = false; },
    playSE(type) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        const now = this.ctx.currentTime;
        if (type === 'decide') {
            osc.frequency.setValueAtTime(880, now); gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'damage') {
            osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(50, now + 0.2);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'win') {
            this.stopBGM();
            [523, 659, 783, 1046].forEach((f, i) => {
                const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                o.connect(g); g.connect(this.ctx.destination); o.type = 'square'; o.frequency.value = f;
                g.gain.value = 0.1; g.gain.linearRampToValueAtTime(0, now + i*0.1 + 0.3);
                o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.3);
            });
            setTimeout(() => this.resumeMapBGM(), 2000);
        }
    },
    resumeMapBGM() { if (Game.mapType === 'village') this.playBGM('village'); else this.playBGM('field'); }
};

function toggleBGM() {
    bgmEnabled = !bgmEnabled;
    const btn = document.getElementById('bgm-toggle');
    if (bgmEnabled) {
        btn.innerText = '🔊 BGM ON'; btn.classList.remove('off');
        if (currentMode === 'rpg') Sound.resumeMapBGM();
    } else {

    }
}

function drawTile(key, x, y, fallbackColor) {
    const px = x * TILE_SIZE; const py = y * TILE_SIZE; const img = assets[key];
    if (img && img.complete && img.naturalHeight !== 0) ctx.drawImage(img, px, py, TILE_SIZE, TILE_SIZE);
    else { ctx.fillStyle = fallbackColor; ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE); ctx.strokeStyle="rgba(0,0,0,0.3)"; ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE); }
}

const Game = { mode: 'map', mapData: MAP_VILLAGE, mapType: 'village' };
const Player = {
    x: 15, y: 6, hp: 100, maxHp: 100, dir: 'down',
    move(dx, dy) {
        if (Game.mode !== 'map') return;
        const nextX = this.x + dx; const nextY = this.y + dy;
        if(dx>0) this.dir='right'; if(dx<0) this.dir='left'; if(dy>0) this.dir='down'; if(dy<0) this.dir='up';
        const tile = getTile(nextX, nextY);
        if (tile === 1 || tile === 2 || tile === 3 || (tile >= 6 && tile <= 23)) return;
        this.x = nextX; this.y = nextY;
        this.checkStepEvent(tile, nextX, nextY);
    },
    checkStepEvent(tile, x, y) {
        if (tile === 5) {
            if (Game.mapType === 'village') { Game.mapData = MAP_FIELD; Game.mapType = 'field'; this.x = 12; this.y = 1; Sound.playBGM('field'); }
            else { Game.mapData = MAP_VILLAGE; Game.mapType = 'village'; this.x = 12; this.y = 10; Sound.playBGM('village'); }
            return;
        }
        if (tile === 4) { Battle.start('boss'); return; }
        if (Game.mapType === 'field' && Math.random() < 0.15) { Battle.start('slime'); }
    },
    interact() {
        if (Game.mode !== 'map') { if (Game.mode === 'dialogue') Dialogue.next(); return; }
        let tx = this.x, ty = this.y;
        if (this.dir === 'up') ty--; if (this.dir === 'down') ty++; if (this.dir === 'left') tx--; if (this.dir === 'right') tx++;
        const tile = getTile(tx, ty);
        
        // 村人（タイル6〜23）
        if (tile >= 6 && tile <= 23) {
            const sid = tile - 5;
            // 動的データから取得するように変更
            const stageObj = STAGES.find(s => s.id === sid);
            const currentStageName = stageObj ? stageObj.name : "未知の分野";
            
            const lecArray = LECTURES[sid] || ["まだこの分野の研究は進んでおらんようじゃ..."];
            const text = lecArray[Math.floor(Math.random() * lecArray.length)];
            Sound.playSE('decide');
            Dialogue.show(`${currentStageName}の賢者`, text);
        }
        else if (tile === 2) { Sound.playSE('decide'); this.hp = this.maxHp; Dialogue.show("宿屋の主人", "よく休めたかい？ HPが全回復したよ！"); }
        else if (tile === 3) { Sound.playSE('decide'); this.hp = this.maxHp; Dialogue.show("宿屋の主人", "よく休めたかい？ HPが全回復したよ！"); }
    }
};

function getTile(x, y) {
    if (y < 0 || y >= Game.mapData.length || x < 0 || x >= Game.mapData[0].length) return 1;
    return Game.mapData[y][x];
}

const Input = {
    moveInterval: null,
    startMove(dx, dy) {
        if(Game.mode !== 'map') return;
        Player.move(dx, dy);
        if (this.moveInterval) clearInterval(this.moveInterval);
        this.moveInterval = setInterval(() => { if(Game.mode === 'map') Player.move(dx, dy); }, 150);
    },
    stopMove() { if (this.moveInterval) clearInterval(this.moveInterval); this.moveInterval = null; },
    triggerAction() { Player.interact(); }
};

window.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.key === 'ArrowUp') Input.startMove(0, -1);
    if (e.key === 'ArrowDown') Input.startMove(0, 1);
    if (e.key === 'ArrowLeft') Input.startMove(-1, 0);
    if (e.key === 'ArrowRight') Input.startMove(1, 0);
    if (e.key === ' ' || e.key === 'Enter') Input.triggerAction();
});
window.addEventListener('keyup', () => Input.stopMove());

const Battle = {
    enemy: null, q_list: [],
    start(type) {
        Input.stopMove();
        Game.mode = 'battle'; 
        document.getElementById('battle-ui').style.display = 'flex';
        // ▼ 戦闘開始時にコントローラーを非表示にする
        document.getElementById('controller').style.display = 'none';

        this.q_list = [];
        if (type === 'boss') { Sound.playBGM('boss'); this.enemy = { name: "魔王", hp: 100, maxHp: 100, atk: 30, img: IMAGES.boss }; this.q_list = [...DB].sort(() => Math.random() - 0.5); }
        else { 
            Sound.playBGM('battle');
            this.enemy = { name: "スライム", hp: 20, maxHp: 20, atk: 10, img: IMAGES.slime };
            const shuffled = [...DB].sort(() => Math.random() - 0.5);
            this.q_list = shuffled.slice(0, 3);
        }
        document.getElementById('enemy-name').innerText = this.enemy.name;
        document.getElementById('battle-enemy-img').src = this.enemy.img;
        this.updateUI();
        this.log(`${this.enemy.name} があらわれた！`);
        setTimeout(() => this.nextQuestion(), 1500);
    },
    nextQuestion() {
        if (this.q_list.length === 0) {
            if (this.enemy.hp <= 0 || Player.hp <= 0) return;
            this.q_list = [...DB].sort(() => Math.random() - 0.5);
        }
        const q = this.q_list.pop();
        document.getElementById('quiz-area').style.display = 'block'; document.getElementById('battle-next-btn').style.display = 'none';
        document.getElementById('quiz-text').innerText = q.q;
        const optsDiv = document.getElementById('quiz-options'); optsDiv.innerHTML = '';
        const options = q.a.map((txt, i) => ({ txt, isC: i===0 })).sort(() => Math.random() - 0.5);
        options.forEach(opt => {
            const btn = document.createElement('button'); btn.className = 'btn'; btn.innerText = opt.txt;
            btn.onclick = () => this.answer(btn, opt.isC, q.exp); optsDiv.appendChild(btn);
        });
        this.log("どうする？");
    },
    answer(btn, isCorrect, exp) {
        const btns = document.querySelectorAll('#quiz-options button');
        btns.forEach(b => b.disabled = true);
        if (isCorrect) { btn.classList.add('correct'); Sound.playSE('decide'); this.log(`正解！ ダメージ！`); this.enemy.hp -= 10; }
        else { btn.classList.add('wrong'); Sound.playSE('damage'); this.log(`不正解... (${exp})`); Player.hp -= this.enemy.atk; }
        this.updateUI();
        setTimeout(() => {
            if (Player.hp <= 0) { 
                this.end("GAME OVER..."); 
                Sound.stopBGM(); 
                Player.hp = 1; Player.x = 15; Player.y = 6; 
                Game.mapData = MAP_VILLAGE; Game.mapType = 'village'; 
                setTimeout(() => Sound.playBGM('village'), 2000); 
            }
            else if (this.enemy.hp <= 0) { this.end(`${this.enemy.name} を倒した！`); Sound.playSE('win'); }
            else { document.getElementById('quiz-area').style.display = 'none'; document.getElementById('battle-next-btn').style.display = 'block'; }
        }, 1500);
    },
    next() { this.nextQuestion(); },
    end(msg) { 
        this.log(msg); 
        setTimeout(() => { 
            document.getElementById('battle-ui').style.display = 'none'; 
            Game.mode = 'map'; 
            // ▼ 戦闘終了時にコントローラーを再表示する

function draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const camX = Math.max(0, Math.min(Player.x * TILE_SIZE - canvas.width / 2 + TILE_SIZE/2, Game.mapData[0].length * TILE_SIZE - canvas.width));
    const camY = Math.max(0, Math.min(Player.y * TILE_SIZE - canvas.height / 2 + TILE_SIZE/2, Game.mapData.length * TILE_SIZE - canvas.height));
    ctx.save();
    ctx.translate(-camX, -camY);
    for (let y = 0; y < Game.mapData.length; y++) {
        for (let x = 0; x < Game.mapData[0].length; x++) {
            const tile = Game.mapData[y][x];
            if (tile === 0) drawTile('floor', x, y, '#222');
            if (tile === 1) drawTile('wall', x, y, '#555');
            if (tile === 2) { drawTile('floor', x, y, '#222'); drawTile('villager', x, y, '#ff0'); }
            if (tile === 3) { drawTile('floor', x, y, '#222'); ctx.font="20px sans-serif"; ctx.fillStyle="#fff"; ctx.fillText("INN", x*TILE_SIZE+5, y*TILE_SIZE+30); }
            if (tile === 4) drawTile('boss', x, y, '#90f');
            if (tile === 5) { ctx.fillStyle='#afa'; ctx.fillRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE, TILE_SIZE); }
            if (tile >= 6 && tile <= 23) {
                const sid = tile - 5;
                drawTile('floor', x, y, '#222');
                const villagerKey = 'villager' + sid;
                const villagerImg = assets[villagerKey] || assets['villager'];
                if (villagerImg && villagerImg.complete && villagerImg.naturalHeight !== 0) {
                    ctx.drawImage(villagerImg, x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                } else {
                    const colors = ['#f66','#6f6','#66f','#ff6','#f6f','#6ff','#fa0','#0af','#a0f'];
                    ctx.fillStyle = colors[(sid - 1) % colors.length];
                    ctx.beginPath(); ctx.arc(x*TILE_SIZE + TILE_SIZE/2, y*TILE_SIZE + TILE_SIZE/2, TILE_SIZE/3, 0, Math.PI*2); ctx.fill();
                    ctx.font = "bold 14px sans-serif"; ctx.fillStyle = "#000"; ctx.textAlign = "center";
                    ctx.fillText(sid, x*TILE_SIZE + TILE_SIZE/2, y*TILE_SIZE + TILE_SIZE/2 + 5);
                    ctx.textAlign = "left";
                }
            }
        }
    }
    const heroKey = `hero_${Player.dir}`;
    drawTile(heroKey, Player.x, Player.y, '#4db8ff');
    ctx.restore();
    
    if (currentMode === 'rpg') {
        document.getElementById('status-hp').innerText = Player.hp;
        document.getElementById('status-location').innerText = Game.mapType === 'village' ? '村' : 'フィールド';
    }
    requestAnimationFrame(draw);
}
draw();

function setupControllerEvents() {
    const buttons = [
        { id: 'btn-up', dx: 0, dy: -1 }, { id: 'btn-down', dx: 0, dy: 1 },
        { id: 'btn-left', dx: -1, dy: 0 }, { id: 'btn-right', dx: 1, dy: 0 }
    ];
    buttons.forEach(btn => {
        const el = document.getElementById(btn.id);
        if (!el) return;
        el.addEventListener('touchstart', (e) => { e.preventDefault(); Input.startMove(btn.dx, btn.dy); }, { passive: false });
        el.addEventListener('touchend', (e) => { e.preventDefault(); Input.stopMove(); }, { passive: false });
        el.addEventListener('mousedown', (e) => { e.preventDefault(); Input.startMove(btn.dx, btn.dy); });
        el.addEventListener('mouseup', (e) => { Input.stopMove(); });
        el.addEventListener('mouseleave', (e) => { Input.stopMove(); });
    });
    const actionBtn = document.getElementById('btn-action');
    if (actionBtn) {
        actionBtn.addEventListener('touchstart', (e) => { e.preventDefault(); Input.triggerAction(); }, { passive: false });
        actionBtn.addEventListener('click', (e) => { Input.triggerAction(); });
    }
}
setupControllerEvents();

// ===========================================
const DG = {
    state: { mode: 'normal', currentStageId: 0, p_hp: 100, p_max: 100, e_hp: 0, e_max: 0, q_list: [], clearedStages: [], wrongQuestions: [], score: 0, lectureLines: [], lectureIndex: 0 },
    dom: null,
    init() {
        this.dom = {
            wrapper: document.getElementById('dungeon-wrapper'), menu: document.getElementById('dg-menu'), stageGrid: document.getElementById('dg-stage-grid'),
            actionSelect: document.getElementById('dg-action-select'), diffSelect: document.getElementById('dg-diff-select'), study: document.getElementById('dg-study'),
            battle: document.getElementById('dg-battle'), result: document.getElementById('dg-result'), headerTitle: document.getElementById('dg-header-title'),
            actTitle: document.getElementById('dg-act-title'), dialogueText: document.getElementById('dg-dialogue-text'), lecPrev: document.getElementById('dg-lec-prev'),
            lecNext: document.getElementById('dg-lec-next'), scene: document.getElementById('dg-scene'), msg: document.getElementById('dg-msg'), quiz: document.getElementById('dg-quiz'),
            nextBtn: document.getElementById('dg-next-btn'), playerHp: document.getElementById('dg-player-hp'), enemyHp: document.getElementById('dg-enemy-hp'), playerHpText: document.getElementById('dg-player-hp-text'),
            enemyName: document.getElementById('dg-enemy-name'), enemyImg: document.getElementById('dg-enemy-img'), enemyEmoji: document.getElementById('dg-enemy-emoji'),
            badge: document.getElementById('dg-badge'), reviewCount: document.getElementById('dg-review-count'), resultTitle: document.getElementById('dg-result-title'), resultMsg: document.getElementById('dg-result-msg')
        };
        this.loadSaveData();
    },
    loadSaveData() {
        const c = localStorage.getItem('e_shikaku_cleared_v7'); if (c) this.state.clearedStages = JSON.parse(c);
        const w = localStorage.getItem('e_shikaku_wrong_v7'); if (w) this.state.wrongQuestions = JSON.parse(w);
        this.updateReviewCount();
    },
    saveClearData() { localStorage.setItem('e_shikaku_cleared_v7', JSON.stringify(this.state.clearedStages)); },
    saveWrongList() { localStorage.setItem('e_shikaku_wrong_v7', JSON.stringify(this.state.wrongQuestions)); this.updateReviewCount(); },
    updateReviewCount() { if (this.dom && this.dom.reviewCount) this.dom.reviewCount.innerText = `${this.state.wrongQuestions.length}問`; },
    show() { this.dom.wrapper.style.display = 'flex'; this.showMenu(); },
    hide() { this.dom.wrapper.style.display = 'none'; },
    showMenu() {
        this.dom.menu.style.display = 'block'; this.dom.actionSelect.style.display = 'none';
        this.dom.diffSelect.style.display = 'none'; this.dom.study.style.display = 'none'; this.dom.battle.style.display = 'none'; this.dom.result.style.display = 'none';
        this.dom.headerTitle.innerText = 'アカデミアの村';
        this.dom.stageGrid.innerHTML = '';
        STAGES.forEach(stg => {
            const div = document.createElement('div'); div.className = 'stage-card';
            if (this.state.clearedStages.includes(stg.id)) div.classList.add('cleared');
            div.innerHTML = `<div class="stage-num">STAGE ${stg.id} ${this.state.clearedStages.includes(stg.id)?'★':''}</div><div class="stage-title">${stg.name}</div>`;
            div.onclick = () => this.openAction(stg.id); this.dom.stageGrid.appendChild(div);
        });
        this.updateReviewCount();
    },
    openAction(sid) {
        this.state.currentStageId = sid; const stg = STAGES.find(s => s.id === sid);
        this.dom.actTitle.innerText = `Stage ${sid}: ${stg.name}`; this.dom.actionSelect.style.display = 'flex'; Sound.playSE('decide');
    },
    closeAction() { this.dom.actionSelect.style.display = 'none'; },
    openDiffSelect() { this.closeAction(); this.dom.diffSelect.style.display = 'flex'; },
    closeDiff() { this.dom.diffSelect.style.display = 'none'; },
    selectDiff(lv) { this.closeDiff(); this.startNormalGame(this.state.currentStageId, lv); },
    startLecture() {
        this.closeAction(); this.dom.menu.style.display = 'none'; this.dom.study.style.display = 'flex'; this.dom.headerTitle.innerText = '賢者の講義';
        const sid = this.state.currentStageId; this.state.lectureLines = LECTURES[sid] || ["まだこの分野の研究は進んでおらんようじゃ..."];
        this.state.lectureIndex = 0; this.updateLectureUI();
    },
    prevLecture() { if (this.state.lectureIndex > 0) { this.state.lectureIndex--; this.updateLectureUI(); } },
    nextLecture() { if (this.state.lectureIndex < this.state.lectureLines.length - 1) { this.state.lectureIndex++; this.updateLectureUI(); } else { this.showMenu(); } },
    updateLectureUI() {
        this.dom.dialogueText.innerText = this.state.lectureLines[this.state.lectureIndex]; Sound.playSE('decide');
        this.dom.lecPrev.disabled = (this.state.lectureIndex === 0);
        this.dom.lecNext.innerText = (this.state.lectureIndex === this.state.lectureLines.length - 1) ? "学習終了" : "次へ ▶";
    },
    startNormalGame(sid, level) {
        this.state.mode = 'normal'; const stg = STAGES.find(s => s.id === sid);
        let qs = DB.filter(q => q.sid === sid); if (qs.length === 0) qs = [...DB];
        this.state.q_list = [...qs].sort(() => Math.random() - 0.5);
        const diff = DIFFICULTIES[level]; this.state.p_max = 100; this.state.p_hp = 100; this.state.e_max = diff.hp; this.state.e_hp = diff.hp;
        const monsterKey = "monster" + sid; this.setupBattleUI(stg.name + "の番人", "👾", `${diff.label}`, "#fff", monsterKey); this.nextTurn();
    },
    startReview() {
        if (this.state.wrongQuestions.length === 0) { alert("復習する問題がありません"); return; }
        this.state.mode = 'review'; this.state.q_list = [...this.state.wrongQuestions].sort(() => Math.random() - 0.5);
        const hp = this.state.q_list.length * 10; this.state.e_max = hp; this.state.e_hp = hp; this.state.p_max = 100; this.state.p_hp = 100;
        this.setupBattleUI("復習の亡霊", "👻", "REVIEW", "#4db8ff", "ghost"); this.nextTurn();
    },
    startSudden() {
        this.state.mode = 'sudden'; this.state.score = 0; this.state.q_list = [...DB].sort(() => Math.random() - 0.5);
        this.state.e_max = 9999; this.state.e_hp = 9999; this.state.p_max = 1; this.state.p_hp = 1;
        this.setupBattleUI("サドンデス神", "💀", "SUDDEN DEATH", "#ff4444", "skull"); this.nextTurn();
    },
    setupBattleUI(name, emoji, badge, color, imgKey) {
        this.dom.menu.style.display = 'none'; this.dom.battle.style.display = 'flex'; this.dom.headerTitle.innerText = '試練の塔'; this.dom.enemyName.innerText = name;
        const imgEl = document.getElementById('dg-enemy-img'); const emojiEl = this.dom.enemyEmoji;
        if (imgKey && IMAGES[imgKey]) { imgEl.src = IMAGES[imgKey]; imgEl.style.display = 'block'; emojiEl.style.display = 'none'; imgEl.onerror = () => { imgEl.style.display = 'none'; emojiEl.style.display = 'block'; }; }
        else { imgEl.style.display = 'none'; emojiEl.style.display = 'block'; emojiEl.innerText = emoji; }
        this.dom.badge.innerText = badge; this.dom.badge.style.background = color; this.dom.badge.style.color = (color === '#fff') ? '#000' : '#fff';
        this.updateBars(); this.setMsg("バトル開始！"); this.dom.nextBtn.style.display = 'none'; Sound.playBGM('battle');
    },
    nextTurn() {
        this.dom.nextBtn.style.display = 'none';
        if (this.state.q_list.length === 0) { if (this.state.mode === 'review') { this.gameClear("復習完了！"); return; } this.state.q_list = [...DB].sort(() => Math.random() - 0.5); }
        const q = this.state.q_list.pop(); this.showQuiz(q);
    },
    showQuiz(q) {
        if (!q) return;
        let prefix = ""; if (this.state.mode === 'sudden') prefix = `[${this.state.score}問正解] `;
        this.setMsg(`${prefix}Q. ${q.q}`); this.dom.quiz.innerHTML = '';
        let opts = q.a.map((t, i) => ({ t, c: i === 0 })).sort(() => Math.random() - 0.5);
        opts.forEach(o => { const b = document.createElement('button'); b.className = 'dg-quiz-btn'; b.innerText = o.t; b.onclick = () => this.answer(b, o.c, q); this.dom.quiz.appendChild(b); });
    },
    answer(btn, isCorrect, q) {
        Array.from(this.dom.quiz.children).forEach(b => b.disabled = true);
        if (isCorrect) {
            btn.classList.add('correct'); Sound.playSE('decide'); this.setMsg(`正解！<br><span style="color:#4db8ff; font-size:0.85rem;">${q.exp}</span>`);
            if (this.state.mode === 'review') { this.state.wrongQuestions = this.state.wrongQuestions.filter(w => w.q !== q.q); this.saveWrongList(); }
            else if (this.state.mode === 'sudden') { this.state.score++; }
            this.damageEnemy();
        } else {
            btn.classList.add('wrong'); Sound.playSE('damage'); this.setMsg(`不正解...<br><span style="color:#4db8ff; font-size:0.85rem;">${q.exp}</span>`);
            Array.from(this.dom.quiz.children).forEach(b => { if (b.innerText === q.a[0]) b.classList.add('correct'); });
            if (!this.state.wrongQuestions.some(w => w.q === q.q)) { this.state.wrongQuestions.push(q); this.saveWrongList(); }
            this.damagePlayer();
        }
    },
    damageEnemy() {
        this.dom.enemyEmoji.classList.add('dg-anim-damage'); if (this.dom.enemyImg) this.dom.enemyImg.classList.add('dg-anim-damage');
        if (this.state.mode !== 'sudden') { this.state.e_hp = Math.max(0, this.state.e_hp - 10); if (this.state.p_hp < this.state.p_max) { this.state.p_hp = Math.min(this.state.p_max, this.state.p_hp + 5); } }
        this.updateBars();
        setTimeout(() => { this.dom.enemyEmoji.classList.remove('dg-anim-damage'); if (this.dom.enemyImg) this.dom.enemyImg.classList.remove('dg-anim-damage'); this.dom.nextBtn.style.display = 'block'; }, 500);
    },
    damagePlayer() {
        this.dom.scene.classList.add('dg-anim-damage'); this.state.p_hp = Math.max(0, this.state.p_hp - 20); this.updateBars();
        setTimeout(() => { this.dom.scene.classList.remove('dg-anim-damage'); this.dom.nextBtn.style.display = 'block'; }, 500);
    },
    handleNext() {
        Sound.playSE('decide');
        if (this.state.p_hp <= 0) { if (this.state.mode === 'sudden') { this.gameOver(`記録: ${this.state.score}問`); } else { this.gameOver(); } return; }
        if (this.state.mode !== 'sudden' && this.state.e_hp <= 0) { this.gameClear(); return; }
        this.nextTurn();
    },
    updateBars() {
        if (this.state.mode === 'sudden') { this.dom.playerHp.style.width = '100%'; this.dom.enemyHp.style.width = '100%'; }
        else { this.dom.playerHp.style.width = Math.max(0, (this.state.p_hp / this.state.p_max) * 100) + '%'; this.dom.enemyHp.style.width = Math.max(0, (this.state.e_hp / this.state.e_max) * 100) + '%'; }
        this.dom.playerHpText.innerText = this.state.p_hp;
    },
    gameClear(msgText) {
        Sound.stopBGM(); Sound.playSE('win');
        if (this.state.mode === 'normal') { if (!this.state.clearedStages.includes(this.state.currentStageId)) { this.state.clearedStages.push(this.state.currentStageId); this.saveClearData(); } }
        this.dom.result.style.display = 'flex'; this.dom.resultTitle.innerText = "CLEAR!!"; this.dom.resultTitle.style.color = "#4db8ff"; this.dom.resultMsg.innerText = msgText || "完全勝利！";
    },
    gameOver(msgText) {
        Sound.stopBGM(); this.dom.result.style.display = 'flex'; this.dom.resultTitle.innerText = "GAME OVER"; this.dom.resultTitle.style.color = "#f44"; this.dom.resultMsg.innerText = msgText || "出直してこい！";
    },
    setMsg(html) { this.dom.msg.innerHTML = html; },
    confirmExit() { if (confirm("バトルを中断してメニューに戻りますか？")) { Sound.stopBGM(); this.dom.battle.style.display = 'none'; this.showMenu(); } }
};

// ===========================================
// モード切り替え
// ===========================================

function startRPGMode() {
    if (DB.length === 0) {
        alert("先に問題データ(CSV)をセットしてください！");
        return;
    }
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('dungeon-wrapper').style.display = 'none';
    document.getElementById('rpg-status').style.display = 'flex';
    currentMode = 'rpg'; Sound.init(); Sound.playBGM('village');
}

function startDungeonMode() {
    if (DB.length === 0) {
        alert("先に問題データ(CSV)をセットしてください！");
        return;
    }
    document.getElementById('start-screen').style.display = 'none';
    currentMode = 'dungeon'; Sound.init(); DG.init(); DG.show();
}

function backToModeSelect() {
    Sound.stopBGM(); DG.hide(); document.getElementById('start-screen').style.display = 'flex'; currentMode = null;
}

function backToTitle() {
    Sound.stopBGM();
    document.getElementById('rpg-status').style.display = 'none';
    document.getElementById('dungeon-wrapper').style.display = 'none';
    document.getElementById('start-screen').style.display = 'flex';
    
    // ▼ タイトルに戻った時にコントローラーを念のため再表示する
    document.getElementById('controller').style.display = 'grid';
    
    Player.x = 15; Player.y = 6; Player.hp = Player.maxHp;
    Game.mapData = MAP_VILLAGE; Game.mapType = 'village'; Game.mode = 'map'; currentMode = null;
}

</script>
